name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      # Push the published report to the gh-pages branch.
      contents: write
      # Check whether GitHub Pages is enabled before linking to the published page.
      pages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Restore test credentials
        env:
          AUTH_CSV_BASE64: ${{ secrets.AUTH_CSV_BASE64 }}
        run: |
          if [ -z "$AUTH_CSV_BASE64" ]; then
            echo "Missing AUTH_CSV_BASE64 GitHub secret"
            exit 1
          fi
          # testdata/common only holds the git-ignored auth.csv, so the folder is not in the repo.
          mkdir -p testdata/common
          printf '%s' "$AUTH_CSV_BASE64" | base64 --decode > testdata/common/auth.csv

      - name: Type check
        run: npm run typecheck

      - name: Run Playwright tests
        id: tests
        env:
          BASE_URL: https://dev.imerzn.com
          IMERZN_PASSWORD: ${{ secrets.IMERZN_PASSWORD }}
          RUN_SIGNUP_TEST: 'true'
          # The JSON reporter writes results.json, used by the Slack summary below.
          PLAYWRIGHT_JSON_OUTPUT_NAME: results.json
        # One test at a time (workers: 1 in playwright.config.ts): later tests reuse accounts and
        # content created by earlier ones (testdata/*/created-*.json). Projects run in order:
        # setup (signups, experience, gallery) -> chromium (all other tests) -> booking-flow.
        # The output is also saved to playwright-output.log for the Slack thread.
        shell: bash
        run: |
          set -o pipefail
          npx playwright test --workers=1 --reporter=list,html,json 2>&1 | tee playwright-output.log

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Build failure page for GitHub Pages
        id: pages_prep
        # Not for pull requests: they cannot push to gh-pages.
        if: always() && github.event_name != 'pull_request' && hashFiles('results.json') != ''
        run: |
          # The repo is public, so the published page is public. Playwright's HTML report is not
          # published: its steps list typed values (Fill "<password>") and traces record logins.
          # This page has only failed tests' names, errors (passwords masked), and screenshots.
          # The full report stays in the playwright-report artifact above.
          node scripts/failure-report.mjs results.json public-report slack-failures.json
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO="${{ github.event.repository.name }}"
          # Link to the page only if GitHub Pages is enabled for the repo (Settings > Pages, branch
          # gh-pages); otherwise Slack falls back to the run link. The page is published either way.
          PAGES_STATUS=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          if [ "$PAGES_STATUS" = "200" ]; then
            echo "url=https://$OWNER.github.io/$REPO/reports/${{ github.run_id }}/" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::GitHub Pages is not enabled (HTTP $PAGES_STATUS); Slack will link to the run instead."
          fi

      - name: Publish report to GitHub Pages
        id: pages
        if: always() && steps.pages_prep.outcome == 'success'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public-report
          # One folder per run, so each Slack link keeps pointing at its own report.
          destination_dir: reports/${{ github.run_id }}
          keep_files: true

      - name: Notify Slack
        # Runs after every job (pass or fail). On failure, each failed test's error and screenshot
        # and the full log are posted in the message's thread. Needs the SLACK_BOT_TOKEN and
        # SLACK_CHANNEL_ID repository secrets (see scripts/slack-report.mjs); with only
        # SLACK_WEBHOOK_URL it posts the summary text.
        if: always()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          IMERZN_PASSWORD: ${{ secrets.IMERZN_PASSWORD }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          REPORT_URL: ${{ steps.pages.outcome == 'success' && steps.pages_prep.outputs.url || '' }}
        run: |
          if [ -f results.json ]; then
            SUMMARY=$(jq -r '"Passed: \(.stats.expected // 0)  |  Failed: \(.stats.unexpected // 0)  |  Flaky: \(.stats.flaky // 0)  |  Skipped: \(.stats.skipped // 0)"' results.json)
            # Pull requests skip the GitHub Pages step, which writes the failures list.
            [ -f slack-failures.json ] || node scripts/failure-report.mjs results.json slack-report-tmp slack-failures.json
          else
            SUMMARY="Tests did not run (failed before the test step)."
          fi
          node scripts/slack-report.mjs --name "Playwright tests" --outcome "$TEST_OUTCOME" --summary "$SUMMARY" \
            --failures slack-failures.json --log playwright-output.log \
            --run-url "$RUN_URL" --report-url "$REPORT_URL" --branch "$BRANCH" --actor "$ACTOR" \
            || echo "::warning::Slack notification failed (check the SLACK_* secrets)."
