name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Restore test credentials
        env:
          AUTH_CSV_BASE64: ${{ secrets.AUTH_CSV_BASE64 }}
        run: |
          if [ -z "$AUTH_CSV_BASE64" ]; then
            echo "Missing AUTH_CSV_BASE64 GitHub secret"
            exit 1
          fi
          # testdata/common only holds the git-ignored auth.csv, so the folder is not in the repo.
          mkdir -p testdata/common
          printf '%s' "$AUTH_CSV_BASE64" | base64 --decode > testdata/common/auth.csv

      - name: Type check
        run: npm run typecheck

      - name: Run Playwright tests
        env:
          BASE_URL: https://dev.imerzn.com
          IMERZN_PASSWORD: ${{ secrets.IMERZN_PASSWORD }}
          RUN_SIGNUP_TEST: 'true'
        # One test at a time, in file order: later tests reuse accounts and content
        # created by earlier ones (testdata/*/created-*.json), so they must not run in parallel.
        run: npx playwright test --workers=1

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7