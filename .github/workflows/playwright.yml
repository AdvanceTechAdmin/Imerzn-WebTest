name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Every day at 05:00 GMT+7 (Vietnam), which is 22:00 UTC the day before. GitHub schedules use
  # UTC, run on the default branch (main), and can start a few minutes late when GitHub is busy.
  schedule:
    - cron: '0 22 * * *'

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      # Push the published report to the gh-pages branch.
      contents: write
      # Check whether GitHub Pages is enabled before linking to the published page.
      pages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Restore test credentials
        env:
          AUTH_CSV_BASE64: ${{ secrets.AUTH_CSV_BASE64 }}
        run: |
          if [ -z "$AUTH_CSV_BASE64" ]; then
            echo "Missing AUTH_CSV_BASE64 GitHub secret"
            exit 1
          fi
          # testdata/common only holds the git-ignored auth.csv, so the folder is not in the repo.
          mkdir -p testdata/common
          printf '%s' "$AUTH_CSV_BASE64" | base64 --decode > testdata/common/auth.csv

      - name: Type check
        run: npm run typecheck

      - name: Run Playwright tests
        id: tests
        env:
          BASE_URL: https://dev.imerzn.com
          IMERZN_PASSWORD: ${{ secrets.IMERZN_PASSWORD }}
          RUN_SIGNUP_TEST: 'true'
          # The JSON reporter writes results.json, used by the Slack summary below.
          PLAYWRIGHT_JSON_OUTPUT_NAME: results.json
        # One test at a time (workers: 1 in playwright.config.ts): later tests reuse accounts and
        # content created by earlier ones (testdata/*/created-*.json). Projects run in order:
        # setup (signups, experience, gallery) -> chromium (all other tests) -> booking-flow.
        run: npx playwright test --workers=1 --reporter=list,html,json

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Build failure page for GitHub Pages
        id: pages_prep
        # Not for pull requests: they cannot push to gh-pages.
        if: always() && github.event_name != 'pull_request' && hashFiles('results.json') != ''
        run: |
          # The repo is public, so the published page is public. Playwright's HTML report is not
          # published: its steps list typed values (Fill "<password>") and traces record logins.
          # This page has only failed tests' names, errors (passwords masked), and screenshots.
          # The full report stays in the playwright-report artifact above.
          node scripts/failure-report.mjs results.json public-report
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO="${{ github.event.repository.name }}"
          # Link to the page only if GitHub Pages is enabled for the repo (Settings > Pages, branch
          # gh-pages); otherwise Slack falls back to the run link. The page is published either way.
          PAGES_STATUS=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          if [ "$PAGES_STATUS" = "200" ]; then
            echo "url=https://$OWNER.github.io/$REPO/reports/${{ github.run_id }}/" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::GitHub Pages is not enabled (HTTP $PAGES_STATUS); Slack will link to the run instead."
          fi

      - name: Publish report to GitHub Pages
        id: pages
        if: always() && steps.pages_prep.outcome == 'success'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public-report
          # One folder per run, so each Slack link keeps pointing at its own report.
          destination_dir: reports/${{ github.run_id }}
          keep_files: true

      - name: Notify Slack
        # Runs after every job (pass or fail). Needs the SLACK_WEBHOOK_URL repository secret
        # (a Slack "Incoming Webhook" URL).
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          REPORT_URL: ${{ steps.pages.outcome == 'success' && steps.pages_prep.outputs.url || '' }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL secret is not set; skipping Slack notification."
            exit 0
          fi

          if [ -f results.json ]; then
            PASSED=$(jq '.stats.expected // 0' results.json)
            FAILED=$(jq '.stats.unexpected // 0' results.json)
            FLAKY=$(jq '.stats.flaky // 0' results.json)
            SKIPPED=$(jq '.stats.skipped // 0' results.json)
            FAILED_TESTS=$(jq -r '[.. | objects | select(has("specs")) | .specs[] | select(.ok == false) | "• " + .title] | .[:15] | join("\n")' results.json)
          else
            PASSED=0; FAILED=0; FLAKY=0; SKIPPED=0; FAILED_TESTS="Tests did not run (failed before the test step)."
          fi

          if [ "$TEST_OUTCOME" = "success" ]; then
            ICON=":white_check_mark:"; RESULT="All tests passed"
          else
            ICON=":x:"; RESULT="Tests failed"
          fi

          TEXT="$ICON *Playwright tests — $RESULT* (branch \`$BRANCH\`, by $ACTOR)
          Passed: $PASSED  |  Failed: $FAILED  |  Flaky: $FLAKY  |  Skipped: $SKIPPED"
          if [ -n "$FAILED_TESTS" ] && [ "$TEST_OUTCOME" != "success" ]; then
            TEXT="$TEXT
          *Failed tests:*
          $FAILED_TESTS"
          fi
          if [ -n "$REPORT_URL" ]; then
            TEXT="$TEXT
          <$REPORT_URL|Open failed tests with screenshots>  |  <$RUN_URL|View run>"
          else
            TEXT="$TEXT
          <$RUN_URL|View run and download the report>"
          fi

          # Remove the YAML indentation from continuation lines, then send as JSON.
          TEXT=$(printf '%s' "$TEXT" | sed 's/^          //')
          jq -n --arg text "$TEXT" '{text: $text}' \
            | curl -sS -f -X POST -H 'Content-Type: application/json' --data @- "$SLACK_WEBHOOK_URL" \
            || echo "::warning::Slack notification failed (check that SLACK_WEBHOOK_URL is a valid Incoming Webhook URL)."
